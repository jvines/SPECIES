name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # The tree carries pre-existing lint debt, so this reports without
      # failing the build. Flip to a hard failure once the backlog is cleared —
      # a check that is always red teaches people to ignore it.
      - name: ruff (advisory)
        run: ruff check src tests --output-format=github || true
      - name: ruff format check (advisory)
        run: ruff format --check src tests || true

  test:
    name: Tests · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # netCDF4 needs the HDF5/netcdf C libraries for the ATLAS9 grid.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libnetcdf-dev
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,cli,photometry]"
      - name: Test
        run: pytest -q --cov=species --cov-report=term-missing
      # The bundled grid is the package's largest data product and its format is
      # a contract. Assert it survives an install, not just a source checkout.
      - name: Bundled grid loads from the installed package
        run: |
          python - <<'PY'
          from importlib.resources import files
          from pathlib import Path
          from species.moog.grid_io import read_grid_netcdf
          p = Path(str(files("species").joinpath("data", "ATLAS9_grid.nc")))
          assert p.exists(), f"grid missing from the installed package: {p}"
          g = read_grid_netcdf(p)
          n = g["tgrid"].size
          assert n == 41 * 11 * 19, f"unexpected grid size {n}"
          assert g["col0"].shape == (n, 72), g["col0"].shape
          print(f"grid ok: {n} nodes, {p.stat().st_size / 1e6:.1f} MB")
          PY

  build:
    name: Package builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libnetcdf-dev
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # A wheel that omits the grid or the Julia driver installs fine and fails
      # at the first real run, so check the payload rather than the exit code.
      - name: Wheel carries its data
        run: |
          python - <<'PY'
          import zipfile, glob
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          for needed in ("species/data/ATLAS9_grid.nc", "species/korg/solve_ews.jl"):
              assert any(n.endswith(needed) for n in names), f"{needed} missing from {whl}"
          assert not any(n.endswith(".pickle") for n in names), "a pickle came back"
          print(f"{whl}: data files present, no pickles")
          PY
