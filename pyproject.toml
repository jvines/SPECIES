[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-species"
version = "4.1.0"
description = "SPECtroscopic Inference of stEllar parameterS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Maritza Soto", email = "marisotov@gmail.com"},
    {name = "Jose Vines", email = "jose.vines@ug.uchile.cl"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "odrpack>=0.5",
    "astropy>=6.0",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "uncertainties>=3.1",
    "PyAstronomy>=0.21",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
photometry = ["astroquery>=0.4.7"]
cli = ["click>=8.1"]
test = ["pytest>=8.0", "pytest-cov"]
dev = ["astro-species[photometry,cli,test]", "ruff"]

[project.scripts]
species = "species.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
species = ["data/linelists/*.dat", "data/masks/*.mas", "data/*.nc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["slow: marks tests as slow (requires MOOG + grid)"]

[tool.ruff]
target-version = "py312"
line-length = 100
